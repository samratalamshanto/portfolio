<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Banking System Architecture">
  <defs>
    <linearGradient id="bgBk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1320"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="cardBk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2538"/>
      <stop offset="100%" stop-color="#181d2e"/>
    </linearGradient>
    <linearGradient id="secureBk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a5e"/>
      <stop offset="100%" stop-color="#1f2c47"/>
    </linearGradient>
    <marker id="arrBk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6a86c7" opacity="0.85"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bgBk)"/>

  <g stroke="#2a3148" stroke-width="0.5" opacity="0.3">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800"/>
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500"/>
  </g>

  <text x="40" y="50" fill="#8597c5" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">BANKING — TRANSACTION ISOLATION + EVENT WORKFLOWS</text>

  <!-- Client + Auth -->
  <g transform="translate(60, 90)">
    <rect width="180" height="50" rx="8" fill="url(#secureBk)" stroke="#4a5a85" stroke-width="1"/>
    <text x="90" y="22" fill="#eaf0ff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Spring Security · JWT</text>
    <text x="90" y="38" fill="#b9c5e3" font-family="ui-monospace, Menlo, monospace" font-size="10" text-anchor="middle">RBAC · refresh tokens</text>
  </g>
  <g transform="translate(560, 90)">
    <rect width="180" height="50" rx="8" fill="url(#cardBk)" stroke="#3a4664" stroke-width="1"/>
    <text x="90" y="22" fill="#dde3f5" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Audit · Notifications</text>
    <text x="90" y="38" fill="#8597c5" font-family="ui-monospace, Menlo, monospace" font-size="10" text-anchor="middle">async listeners</text>
  </g>

  <!-- Core services row -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#dde3f5" text-anchor="middle">
    <g transform="translate(60, 190)">
      <rect width="160" height="68" rx="8" fill="url(#cardBk)" stroke="#3a4664" stroke-width="1"/>
      <text x="80" y="28">Accounts</text>
      <text x="80" y="48" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8597c5" font-weight="400">balance · history</text>
    </g>
    <g transform="translate(250, 190)">
      <rect width="160" height="68" rx="8" fill="url(#cardBk)" stroke="#3a4664" stroke-width="1"/>
      <text x="80" y="28">Transactions</text>
      <text x="80" y="48" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8597c5" font-weight="400">SERIALIZABLE</text>
    </g>
    <g transform="translate(440, 190)">
      <rect width="160" height="68" rx="8" fill="url(#cardBk)" stroke="#3a4664" stroke-width="1"/>
      <text x="80" y="28">Transfers</text>
      <text x="80" y="48" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8597c5" font-weight="400">2-phase commit</text>
    </g>
    <g transform="translate(630, 190)">
      <rect width="110" height="68" rx="8" fill="url(#cardBk)" stroke="#3a4664" stroke-width="1"/>
      <text x="55" y="28">Reports</text>
      <text x="55" y="48" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8597c5" font-weight="400">CQRS read</text>
    </g>
  </g>

  <!-- Kafka strip -->
  <g transform="translate(60, 300)">
    <rect width="680" height="50" rx="10" fill="#2c3a5c" stroke="#5a6f9e" stroke-width="1"/>
    <text x="340" y="22" fill="#eaf0ff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Kafka — Event Bus</text>
    <text x="340" y="40" fill="#b9c5e3" font-family="ui-monospace, Menlo, monospace" font-size="10" text-anchor="middle">tx.committed · tx.failed · balance.updated · notification.queued</text>
  </g>

  <!-- DBs -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#b9c5e3" text-anchor="middle">
    <g transform="translate(60, 380)">
      <rect width="320" height="76" rx="8" fill="url(#cardBk)" stroke="#3a4664" stroke-width="1"/>
      <text x="160" y="28" fill="#dde3f5" font-weight="600" font-size="12">PostgreSQL — Write Model</text>
      <text x="160" y="50" font-family="ui-monospace, Menlo, monospace" font-size="10">accounts · transactions · ledger</text>
      <text x="160" y="64" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8597c5">strict isolation · audit log</text>
    </g>
    <g transform="translate(420, 380)">
      <rect width="320" height="76" rx="8" fill="url(#cardBk)" stroke="#3a4664" stroke-width="1"/>
      <text x="160" y="28" fill="#dde3f5" font-weight="600" font-size="12">Read Model · Redis Cache</text>
      <text x="160" y="50" font-family="ui-monospace, Menlo, monospace" font-size="10">denormalized projections</text>
      <text x="160" y="64" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8597c5">eventually consistent</text>
    </g>
  </g>

  <!-- Arrows -->
  <g stroke="#5a6f9e" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M150 140 V190" marker-end="url(#arrBk)"/>
    <path d="M650 140 V190" marker-end="url(#arrBk)"/>
  </g>
  <g stroke="#5a6f9e" stroke-width="1.2" stroke-dasharray="4 3" fill="none" opacity="0.65">
    <path d="M140 258 V300"/>
    <path d="M330 258 V300"/>
    <path d="M520 258 V300"/>
    <path d="M685 258 V300"/>
    <path d="M220 350 V380"/>
    <path d="M580 350 V380"/>
  </g>

  <text x="760" y="478" fill="#5a6685" font-family="ui-monospace, Menlo, monospace" font-size="9" text-anchor="end" opacity="0.7">// P-02 · architecture sketch</text>
</svg>
