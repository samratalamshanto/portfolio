<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Go REST API Architecture">
  <defs>
    <linearGradient id="bgGo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1320"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="cardGo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2538"/>
      <stop offset="100%" stop-color="#181d2e"/>
    </linearGradient>
    <linearGradient id="layerGo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3a5e"/>
      <stop offset="100%" stop-color="#1f2c47"/>
    </linearGradient>
    <marker id="arrGo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6a86c7" opacity="0.9"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bgGo)"/>

  <g stroke="#2a3148" stroke-width="0.5" opacity="0.3">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800"/>
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500"/>
  </g>

  <text x="40" y="50" fill="#8597c5" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">REST API IN GO — CLEAN ARCHITECTURE</text>

  <!-- Left side: layered stack -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#dde3f5">
    <g transform="translate(60, 90)">
      <rect width="340" height="56" rx="8" fill="url(#cardGo)" stroke="#3a4664" stroke-width="1"/>
      <text x="20" y="24">HTTP Layer · Gin Router</text>
      <text x="20" y="44" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8597c5" font-weight="400">/students /teachers /courses · middleware: auth, logging</text>
    </g>
    <g transform="translate(60, 162)">
      <rect width="340" height="56" rx="8" fill="url(#cardGo)" stroke="#3a4664" stroke-width="1"/>
      <text x="20" y="24">Handler</text>
      <text x="20" y="44" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8597c5" font-weight="400">decode request · invoke service · encode response</text>
    </g>
    <g transform="translate(60, 234)">
      <rect width="340" height="56" rx="8" fill="url(#layerGo)" stroke="#4a5a85" stroke-width="1"/>
      <text x="20" y="24" fill="#eaf0ff">Service · Business Logic</text>
      <text x="20" y="44" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#b9c5e3" font-weight="400">validation · orchestration · domain rules</text>
    </g>
    <g transform="translate(60, 306)">
      <rect width="340" height="56" rx="8" fill="url(#cardGo)" stroke="#3a4664" stroke-width="1"/>
      <text x="20" y="24">Repository</text>
      <text x="20" y="44" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8597c5" font-weight="400">interface · pgx queries · tx boundary</text>
    </g>
    <g transform="translate(60, 378)">
      <rect width="340" height="60" rx="8" fill="url(#cardGo)" stroke="#3a4664" stroke-width="1"/>
      <text x="20" y="26">PostgreSQL</text>
      <text x="20" y="46" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8597c5" font-weight="400">students · teachers · courses · enrolments</text>
    </g>
  </g>

  <!-- Arrows down the stack -->
  <g stroke="#5a6f9e" stroke-width="1.4" fill="none" opacity="0.75">
    <path d="M230 146 V162" marker-end="url(#arrGo)"/>
    <path d="M230 218 V234" marker-end="url(#arrGo)"/>
    <path d="M230 290 V306" marker-end="url(#arrGo)"/>
    <path d="M230 362 V378" marker-end="url(#arrGo)"/>
  </g>

  <!-- Right side: external -->
  <g transform="translate(460, 90)">
    <rect width="280" height="120" rx="10" fill="url(#cardGo)" stroke="#3a4664" stroke-width="1"/>
    <text x="20" y="30" fill="#dde3f5" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Docker · Build &amp; Run</text>
    <text x="20" y="52" fill="#8597c5" font-family="ui-monospace, Menlo, monospace" font-size="10">multi-stage Dockerfile</text>
    <text x="20" y="70" fill="#8597c5" font-family="ui-monospace, Menlo, monospace" font-size="10">distroless final image</text>
    <text x="20" y="88" fill="#8597c5" font-family="ui-monospace, Menlo, monospace" font-size="10">docker-compose: api + postgres</text>
    <text x="20" y="108" fill="#8597c5" font-family="ui-monospace, Menlo, monospace" font-size="10">make targets: build, test, lint</text>
  </g>

  <g transform="translate(460, 234)">
    <rect width="280" height="124" rx="10" fill="url(#cardGo)" stroke="#3a4664" stroke-width="1"/>
    <text x="20" y="30" fill="#dde3f5" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Design Principles</text>
    <text x="20" y="54" fill="#b9c5e3" font-family="ui-monospace, Menlo, monospace" font-size="10">• interfaces over concretions</text>
    <text x="20" y="72" fill="#b9c5e3" font-family="ui-monospace, Menlo, monospace" font-size="10">• context propagation</text>
    <text x="20" y="90" fill="#b9c5e3" font-family="ui-monospace, Menlo, monospace" font-size="10">• explicit error wrapping</text>
    <text x="20" y="108" fill="#b9c5e3" font-family="ui-monospace, Menlo, monospace" font-size="10">• table-driven tests</text>
  </g>

  <g transform="translate(460, 382)">
    <rect width="280" height="56" rx="10" fill="url(#cardGo)" stroke="#3a4664" stroke-width="1"/>
    <text x="20" y="26" fill="#dde3f5" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">go test ./...</text>
    <text x="20" y="46" fill="#8597c5" font-family="ui-monospace, Menlo, monospace" font-size="10">handler tests · service tests · repo (sqlmock)</text>
  </g>

  <text x="760" y="478" fill="#5a6685" font-family="ui-monospace, Menlo, monospace" font-size="9" text-anchor="end" opacity="0.7">// P-03 · architecture sketch</text>
</svg>
